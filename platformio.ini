; ESP32RET — PlatformIO build and USB flash
;
; Flash (ESP32 4MB, EVTV / Macchina A0):
;   ./scripts/flash.sh
;   ./scripts/flash.sh stable /dev/ttyUSB0
;
; Flash (ESP32-S3 8MB):
;   ./scripts/flash.sh stable-s3 /dev/ttyACM0
;
; Build only:
;   ./scripts/build.sh
;   ./scripts/build.sh stable-s3

[platformio]
default_envs = stable

[env]
framework = arduino
monitor_speed = 1000000
upload_speed = 921600
upload_protocol = esptool
lib_ldf_mode = chain+
; Arduino-ESP32 3.x splits WiFi and Network. Compiling WiFi as a lib
; does not always add Network/src to the include path.
build_flags =
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_deps =
    https://github.com/mobiletru/can_common.git
    https://github.com/mobiletru/esp32_can.git
    https://github.com/collin80/esp32_mcp2517fd.git
    fastled/FastLED@3.7.8

[env:stable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32dev
board_build.partitions = minspiff.csv
board_upload.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5

[env:stable-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = app_s3.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
